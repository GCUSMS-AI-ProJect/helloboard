  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="csrf-token" content="{{ csrf|default('') }}" />
    <script src="{{ asset_url('theme.js') }}"></script>
    <title data-i18n="HelloBoard · {{ page_name }}">HelloBoard · {{ page_name }}</title>
    <link rel="icon" href="{{ asset_url('helloboard-mark.svg') }}" type="image/svg+xml" />
    {% for font in ui_fonts %}<link rel="preload" href="{{ asset_url(font) }}" as="font" type="font/woff2" crossorigin />{% endfor %}
    <link rel="stylesheet" href="{{ asset_url('fonts/fonts.css') }}" />
    <link rel="stylesheet" href="{{ asset_url('style.css') }}" />
    <script defer src="{{ asset_url('i18n.js') }}"></script>
    {% if page_name == "系统状态" %}<link rel="stylesheet" href="{{ asset_url('dashboard.css') }}" />{% endif %}
    <link rel="stylesheet" href="{{ asset_url('theme.css') }}" />
    <script defer src="{{ asset_url('shell.js') }}"></script>
    {% if page_name == "系统状态" %}<script defer src="{{ asset_url('charts.js') }}"></script><script defer src="{{ asset_url('processes.js') }}"></script>{% endif %}
    <script defer src="{{ asset_url(page_script) }}"></script>
  </head>
