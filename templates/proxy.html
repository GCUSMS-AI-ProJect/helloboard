<!doctype html>
<html lang="zh-CN" data-layout="compact">
  {% set page_name = '代理' %}{% set page_script = 'proxy.js' %}
  {% include 'head.html' %}
  <body>
    {% include 'chrome.html' %}
    <main id="main" class="shell">
      <section class="card proxy-card">
        <h2 data-i18n="终端代理">终端代理</h2>
        <form id="proxy-form">
          <label class="proxy-toggle"><input type="checkbox" role="switch" id="enabled" {% if settings.enabled %}checked{% endif %}> <span data-i18n="启用代理">启用代理</span></label>
          <div class="proxy-fields">
            <label><span data-i18n="代理主机">代理主机</span><input id="host" required maxlength="253" value="{{ settings.host }}"></label>
            <label><span data-i18n="端口">端口</span><input id="port" type="number" required min="1" max="65535" value="{{ settings.port }}"></label>
          </div>
          <p class="muted">保存后在新终端生效。当前终端可运行 <code>source ~/.bashrc</code>。</p>
          <button class="primary-button" type="submit" data-i18n="保存设置">保存设置</button>
          <span id="result" role="status"></span>
        </form>
      </section>
    </main></div>
    <dialog id="login"><form id="auth-form">
      <h2 data-i18n="验证登录">验证登录</h2>
      <label for="username" data-i18n="系统用户名">系统用户名</label><input id="username" value="{{ login_user }}" autocomplete="username" required>
      <label for="password" data-i18n="系统登录密码">系统登录密码</label><input type="password" id="password" autocomplete="current-password" required>
      <p id="auth-error" role="alert" class="field-error"></p>
      <div class="dialog-actions"><button type="button" id="cancel" class="secondary-button" data-i18n="取消">取消</button><button type="submit" class="primary-button" data-i18n="验证">验证</button></div>
    </form></dialog>
    <dialog id="side-panel" class="side-panel"><div class="dialog-heading"><h2 id="panel-title"></h2><button type="button" id="panel-close" class="icon-button" aria-label="关闭">×</button></div><section id="help-content" class="drawer-content">代理设置应用于宿主机用户的 Bash。</section>{% include 'layout_options.html' %}</dialog>
  </body>
</html>
